# This workflow will install Python dependencies, run tests and lint with a variety of Python versions
# For more information see: https://help.github.com/actions/language-and-framework-guides/using-python-with-github-actions

name: Tests

on:
    push:
        branches:
            - master
    pull_request:
    workflow_dispatch:

permissions:
    contents: read

concurrency:
    group: ${{ github.workflow }}-${{ github.head_ref || github.run_id }}
    cancel-in-progress: true

defaults:
    run:
        shell: bash

env:
    PY_COLORS: '1'

jobs:
    build:
        name: ${{ matrix.os }} (py ${{ matrix.version }}${{ matrix.special }})
        runs-on: ${{ matrix.os }}
        strategy:
            fail-fast: false
            matrix:
                os: [ubuntu-latest, macos-latest, windows-latest]
                version: ['3.10', '3.11', '3.12', '3.13', '3.14']
                special: ['']
                include:
                    -   os: ubuntu-latest
                        special: '; pre-release'
                        version: '3.14'
                    -   os: ubuntu-latest
                        special: '; minimum version'
                        version: '3.10'

        steps:
            -   uses: actions/checkout@v7
                with:
                    persist-credentials: false

            -   name: Set up Python
                uses: actions/setup-python@v7
                with:
                    python-version: ${{ matrix.version }}

            -   name: Install dependencies
                run: |
                    if [[ "${{ matrix.special }}" == '; pre-release' ]]; then
                        pip install --pre -e .[test] --upgrade --force-reinstall
                    elif [[ "${{ matrix.special }}" == '; minimum version' ]]; then
                        pip install -r ./test_requirement_min_version.txt
                        # Use the minimum versions as constraints so that no other package can upgrade them
                        pip install -e .[test] -c ./test_requirement_min_version.txt
                    else
                        # The reference geometries of the tests were made with RDKit 2026.09
                        # (see tests/rdkit_references.py); the pre-release job tests newer versions
                        pip install -e .[test] "rdkit==2026.9.*"
                    fi

            -   name: Info Python
                run: |
                    which python
                    python --version

            -   name: Info installed packages
                run: pip list

            -   name: Run tests
                run: pytest -m "not slow"

            -   name: Run codecov
                uses: codecov/codecov-action@v7
                with:
                    files: ./coverage.xml
                    name: codecov-umbrella
                    token: ${{ secrets.CODECOV_TOKEN }}

    Linting:
        runs-on: ubuntu-latest
        steps:
            -   uses: actions/checkout@v7
                with:
                    persist-credentials: false

            -   name: Set up Python on ubuntu-latest
                uses: actions/setup-python@v7
                with:
                    python-version: '3.x'

            -   name: Install linters
                run: pip install .[lint]

            -   name: Python info
                run: |
                    which python
                    python --version

            -   name: Installed packages
                run: pip list

            -   name: Run flake8
                run: flake8 CAT tests

            -   name: Run pydocstyle
                run: pydocstyle CAT tests

    Type-check:
        runs-on: ubuntu-latest
        steps:
            -   uses: actions/checkout@v7
                with:
                    persist-credentials: false

            -   name: Set up Python on ubuntu-latest
                uses: actions/setup-python@v7
                with:
                    python-version: '3.13'

            -   name: Install dependencies
                run: pip install -e . mypy types-PyYAML

            -   name: Installed packages
                run: pip list

            -   name: Run mypy
                run: mypy CAT
                continue-on-error: true

    Docs:
        runs-on: ubuntu-latest
        steps:
            -   uses: actions/checkout@v7
                with:
                    persist-credentials: false

            -   name: Set up Python on ubuntu-latest
                uses: actions/setup-python@v7
                with:
                    python-version: '3.12'

            -   name: Install dependencies
                # The documentation includes the API of Nano-CAT and Data-CAT, whose PyPI releases
                # predate NumPy 2 (and Nano-CAT's pulls in the conflicting `rdkit-pypi` package)
                run: |
                    pip install -e .[docs] h5py pymongo "numpy<2"
                    pip install --no-deps \
                        git+https://github.com/samadel98/nano-CAT@master \
                        git+https://github.com/samadel98/data-CAT@master \
                        git+https://github.com/samadel98/auto-FOX@master

            -   name: Installed packages
                run: pip list

            -   name: Build the documentation
                run: sphinx-build -W --keep-going -b html docs docs/_build/html
