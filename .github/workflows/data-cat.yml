# Test Data-CAT (data-CAT/) against the CAT of this commit

name: Data-CAT

on:
    push:
        branches:
            - master
    pull_request:
    workflow_dispatch:
    schedule:
        # Weekly, to catch breaking releases of dependencies
        -   cron: '0 5 * * 1'

permissions:
    contents: read

concurrency:
    group: ${{ github.workflow }}-${{ github.head_ref || github.run_id }}
    cancel-in-progress: true

defaults:
    run:
        shell: bash
        working-directory: data-CAT

env:
    PY_COLORS: '1'

jobs:
    build:
        name: ${{ matrix.os }} (py ${{ matrix.version }}${{ matrix.special }})
        runs-on: ${{ matrix.os }}
        continue-on-error: ${{ matrix.special == '; pre-release' }}
        strategy:
            fail-fast: false
            matrix:
                os: [ubuntu-latest]
                version: ['3.10', '3.11', '3.12', '3.13', '3.14']
                special: ['']
                include:
                    -   os: macos-latest
                        special: ''
                        version: '3.10'
                    -   os: macos-latest
                        special: ''
                        version: '3.14'
                    -   os: ubuntu-latest
                        special: '; minimum'
                        version: '3.10'
                    -   os: ubuntu-latest
                        special: '; pre-release'
                        version: '3.14'

        steps:
            -   uses: actions/checkout@v7
                with:
                    persist-credentials: false

            -   name: Set up Python
                uses: actions/setup-python@v7
                with:
                    python-version: ${{ matrix.version }}

            -   name: Install dependencies
                run: |
                    case "${{ matrix.special }}" in
                        "; minimum")
                            pip install -e .[test] -e .. -c test_requirement_min_version.txt ;;
                        "; pre-release")
                            pip install -e .[test] -e .. --pre --upgrade ;;
                        *)
                            pip install -e .[test] -e .. ;;
                    esac

            -   name: Start MongoDB
                if: runner.os == 'Linux'
                # MongoDB 8 refuses to start on the Linux >= 6.19 kernels of the
                # current runner images (SERVER-121912), hence the use of MongoDB 7
                run: |
                    docker run --detach --name mongodb --publish 27017:27017 mongo:7
                    for i in $(seq 1 30); do
                        docker exec mongodb mongosh --quiet --eval "db.runCommand({ping: 1}).ok" && break
                        sleep 1
                    done
                    if ! docker exec mongodb mongosh --quiet --eval "db.version()"; then
                        docker logs mongodb
                        exit 1
                    fi

            -   name: Python info
                run: |
                    which python
                    python --version

            -   name: Installed packages
                run: pip list

            -   name: Run tests
                env:
                    DATACAT_REQUIRE_MONGODB: ${{ runner.os == 'Linux' && '1' || '' }}
                run: pytest -m "not slow"

            -   name: Run codecov
                uses: codecov/codecov-action@v7
                with:
                    files: ./data-CAT/coverage.xml
                    flags: data-cat
                    name: codecov-umbrella
                    token: ${{ secrets.CODECOV_TOKEN }}
                    fail_ci_if_error: false

    Type-check:
        runs-on: ubuntu-latest
        steps:
            -   uses: actions/checkout@v7
                with:
                    persist-credentials: false

            -   name: Set up Python on ubuntu-latest
                uses: actions/setup-python@v7
                with:
                    python-version: '3.x'

            -   name: Install dependencies
                run: pip install -e .[lint] ..

            -   name: Installed packages
                run: pip list

            -   name: Run mypy
                run: mypy dataCAT
                continue-on-error: true
