# Install CAT, Nano-CAT (nano-CAT/) and Data-CAT (data-CAT/) together with the Auto-FOX fork,
# run a CAT input end to end and run the test suites of CAT, Nano-CAT and Data-CAT

name: Integration

on:
    push:
        branches:
            - master
    pull_request:
    workflow_dispatch:
    schedule:
        # Weekly, to catch breaking changes in the Auto-FOX fork or the dependencies
        -   cron: '30 5 * * 1'

permissions:
    contents: read

concurrency:
    group: ${{ github.workflow }}-${{ github.head_ref || github.run_id }}
    cancel-in-progress: true

defaults:
    run:
        shell: bash

env:
    PY_COLORS: '1'
    # The branch of the Auto-FOX fork
    FOX_REF: master

jobs:
    integration:
        name: CAT + Nano-CAT + Data-CAT + Auto-FOX (py ${{ matrix.version }})
        runs-on: ubuntu-latest
        timeout-minutes: 45
        strategy:
            fail-fast: false
            matrix:
                version: ['3.10', '3.14']

        services:
            mongodb:
                # MongoDB 8 does not start on the kernel of the ubuntu-latest images
                image: mongo:7
                ports:
                    - 27017:27017

        steps:
            -   uses: actions/checkout@v7
                with:
                    persist-credentials: false

            -   name: Set up Python
                uses: actions/setup-python@v7
                with:
                    python-version: ${{ matrix.version }}

            -   name: Install dependencies
                # The test suites contain reference geometries made with RDKit 2026.09
                run: |
                    pip install -e ".[test]" -e "./nano-CAT[test]" -e "./data-CAT[test]" \
                        "Auto-FOX @ git+https://github.com/samadel98/auto-FOX@${FOX_REF}" \
                        "rdkit==2026.9.*"

            -   name: Info installed packages
                run: pip list

            -   name: Run CAT end to end
                run: python .github/integration/check_stack.py "${RUNNER_TEMP}/cat_run" --mongodb

            -   name: Test CAT
                run: pytest -m "not slow" --no-cov

            -   name: Test Nano-CAT
                working-directory: nano-CAT
                run: pytest -m "not slow" --no-cov

            -   name: Test Data-CAT
                working-directory: data-CAT
                env:
                    DATACAT_REQUIRE_MONGODB: '1'
                run: pytest --no-cov

    conda:
        # Check that `environment.yml` works (and that its conda-forge tblite runs the xTB jobs),
        # with this checkout of CAT, Nano-CAT and Data-CAT installed over the released ones
        name: conda environment (environment.yml)
        runs-on: ubuntu-latest
        timeout-minutes: 45
        defaults:
            run:
                shell: bash -el {0}
        steps:
            -   uses: actions/checkout@v7
                with:
                    persist-credentials: false

            -   name: Create the conda environment
                uses: mamba-org/setup-micromamba@v2
                with:
                    environment-file: environment.yml
                    cache-environment: false

            -   name: Install this checkout
                run: |
                    pip install --no-deps -e . -e ./nano-CAT -e ./data-CAT
                    # The test-only dependencies; environment.yml has the runtime ones
                    pip install pytest pytest-cov pytest-mock Nano-Utils AssertionLib

            -   name: Info installed packages
                run: micromamba list

            -   name: Test the xTB jobs
                run: pytest --no-cov tests/test_xtb.py

            -   name: Test the Nano-CAT BDE workflow with xTB
                working-directory: nano-CAT
                run: pytest --no-cov -m "not slow" tests/test_bde_workflow.py tests/test_construct_xyn.py
